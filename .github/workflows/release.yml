# Pushing a version tag (for example "0.5.4") builds JSymphonic for Linux,
# Windows and macOS and publishes them as a GitHub release.
name: Release

on:
  push:
    tags: ['[0-9]*']

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: mvn -B package

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install WiX 3 (needed by jpackage for the .msi)
        if: runner.os == 'Windows'
        run: |
          command -v candle.exe || choco install wixtoolset --no-progress -y
          echo 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"

      - run: packaging/package.sh "$GITHUB_REF_NAME"

      - name: Add the plain jar (any OS with Java 11+)
        if: runner.os == 'Linux'
        run: cp target/jsymphonic-*-jar-with-dependencies.jar "dist/jsymphonic-$GITHUB_REF_NAME.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
